<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #f4f1ea; color: #222; font-family: Lato, system-ui, sans-serif; line-height: 1.5; }
    .card { max-width: 560px; margin: 32px auto; background: #fff; border-radius: 12px; padding: 24px;
      border: 1px solid #e2ddd2; border-top: 8px solid #1f4d3a; }
    .bad { border-top-color: #b3261e; }
    h1 { font-family: 'Playfair Display', serif; font-size: 24px; margin: 0 0 16px; }
    .ok h1 { color: #1f4d3a; } .bad h1 { color: #b3261e; }
    dl { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; margin: 0; }
    dt { color: #666; } dd { margin: 0; font-weight: 700; }
    .hint { color: #666; font-size: 14px; margin-top: 16px; }
    @media (max-width: 480px) { .card { margin: 16px; } dl { grid-template-columns: 1fr; gap: 2px; } dd { margin-bottom: 8px; } }
  </style>
</head>
<body>
<? if (result.valid) { ?>
  <div class="card ok">
    <h1>Sijil sah</h1>
    <dl>
      <dt>ID Sijil</dt><dd><?= result.id ?></dd>
      <dt>Nama</dt><dd><?= result.nama ?></dd>
      <dt>No. K/P</dt><dd><?= result.icMasked ?></dd>
      <dt>Program</dt><dd><?= result.program ?></dd>
      <dt>Tarikh</dt><dd><?= result.tarikh ?></dd>
      <dt>Dikeluarkan oleh</dt><dd><?= result.org ?></dd>
    </dl>
    <p class="hint">No. K/P disembunyikan sebahagian untuk melindungi privasi peserta.</p>
  </div>
<? } else { ?>
  <div class="card bad">
    <h1>Sijil tidak dijumpai</h1>
    <p>ID <strong><?= result.id ?></strong> tiada dalam rekod kami. Sijil ini mungkin tidak sah, atau rekodnya telah dipadam mengikut tempoh simpanan data.</p>
  </div>
<? } ?>
</body>
</html>
